name: Release

# A release costs a version bump, a CHANGELOG entry, a commit and a tag.
# Everything below the tag is this file. See #276 for why, and
# documentation/RELEASE_CHECKLIST.md for what a human still decides.
#
# The chain, in order:
#   tag -> heavy suites -> build under Nix -> manifest -> notes -> GitHub release
#        -> one commit to the wrapper's `release` branch, which builds the installers.
#
# Nothing is published until the suites are green, because the alpha.1 release
# shipped desktop builds that could not launch (#260, #266) and the check that
# would have caught it existed but was never on the release path.

on:
  push:
    tags:
      - 'v*'
  # A release workflow you cannot run without releasing is a workflow nobody
  # tests. Dispatch builds everything and publishes nothing, so the whole chain
  # can be exercised against a branch before a tag is ever pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build as (e.g. v0.6.0-alpha.2). Nothing is published.
        type: string
        required: true
      skip_tests:
        description: Skip the heavy suites (dispatch only, never on a real tag)
        type: boolean
        default: false

concurrency:
  # ref_name, not ref: a dispatch for v1.2.3 and the tag push of v1.2.3 are the
  # same release and must queue behind each other.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Read-only by default. Each job asks for exactly what it uses, so the build
# job, which installs third-party packages and runs their scripts, never holds a
# token that can write to this repository.
permissions:
  contents: read

jobs:
  # The gate. `inputs.skip_tests` is only settable from the Actions tab, so a
  # tag push always pays for it.
  heavy-tests:
    if: ${{ !inputs.skip_tests }}
    # A called workflow can only narrow what its caller grants. tests-manual.yml
    # declares pull-requests: write (to drop its trigger label, a step that never
    # runs on this path), and a caller granting less fails the call at startup.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/tests-manual.yml
    with:
      suite: both
      ref: ${{ github.ref }}

  build:
    name: Build and describe the release
    needs: heavy-tests
    # `needs` on a skipped job would skip this one too, and the dispatch path is
    # allowed to skip the gate.
    if: ${{ always() && (needs.heavy-tests.result == 'success' || needs.heavy-tests.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.describe.outputs.version }}
      prerelease: ${{ steps.describe.outputs.prerelease }}
      webhapp_sha256: ${{ steps.describe.outputs.webhapp_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing here pushes, so the token is not left in .git/config for
          # the install and build steps to find.
          persist-credentials: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm32-${{ hashFiles('flake.lock') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # Through env, never interpolated into the script: a tag or a dispatch
      # input is text someone typed, and an expression inside `run` is pasted into
      # the shell before it parses.
      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "value=$TAG" >> "$GITHUB_OUTPUT"

      # The same check CI and the heavy suites run: the published artefact must
      # not be built from a vendored tarball nobody checked.
      - name: Verify the vendored hREA adapter
        run: cd vendor && sha256sum -c valueflows-vf-graphql-holochain-0.700.0-rc.0.tgz.sha256

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run package` is build:zomes -> hc app pack -> ui build -> hc web-app
      # pack, and it is the same command a maintainer runs locally. Keeping CI on
      # the same entry point is what stops the two from drifting.
      - name: Pack the hApp and the webhapp
        run: |
          nix develop --command bash -c '
            bun run download-hrea
            test -s workdir/hrea.dna || { echo "hrea.dna missing or empty"; exit 1; }
            bun run package
          '

      # The desktop network seed is the wrapper's, not the hApp's: desktop
      # testers run `networkSeed` from the wrapper's kangaroo.config.ts, which
      # replaces the seed in workdir/happ.yaml at install time. The wrapper is a
      # public repository, so this is a plain fetch with no token; the `desktop`
      # job below pushes to the same branch and never touches the seed.
      - name: Fetch the wrapper's config
        run: |
          curl --fail --silent --show-error --location \
            --output wrapper-kangaroo.config.ts \
            "https://raw.githubusercontent.com/happenings-community/requests-and-offers-kangaroo-electron/release/kangaroo.config.ts"

      - name: Write the release manifest
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          nix develop --command bun scripts/release-manifest.ts \
            --tag "$TAG" \
            --happ workdir/requests_and_offers.happ \
            --webhapp workdir/requests_and_offers.webhapp \
            --dna dnas/requests_and_offers/workdir/requests_and_offers.dna \
            --hrea-dna workdir/hrea.dna \
            --wrapper-config wrapper-kangaroo.config.ts \
            --wrapper-config-source "happenings-community/requests-and-offers-kangaroo-electron@release:kangaroo.config.ts" \
            --out release-manifest.json

      - name: Write the release notes
        run: |
          bun scripts/release-notes.ts \
            --version "$(jq -r .version release-manifest.json)" \
            --manifest release-manifest.json \
            --out release-notes.md
          cat release-notes.md

      - name: Describe the release
        id: describe
        run: |
          version=$(jq -r .version release-manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "webhapp_sha256=$(jq -r .webhapp.sha256 release-manifest.json)" >> "$GITHUB_OUTPUT"
          # SemVer says a hyphen introduces a prerelease identifier, and every
          # alpha this project has cut carries one. Nothing else decides this.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v6
        with:
          name: release-artefacts
          path: |
            workdir/requests_and_offers.happ
            workdir/requests_and_offers.webhapp
            release-manifest.json
            release-notes.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    # Dispatch builds and describes; only a tag publishes.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-artefacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          # A re-run after a later job failed finds the release already there:
          # replace its files and notes rather than failing on create.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              workdir/requests_and_offers.happ \
              workdir/requests_and_offers.webhapp \
              release-manifest.json
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            # PRERELEASE is unquoted on purpose: empty must vanish, not become "".
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes-file release-notes.md \
              $PRERELEASE \
              workdir/requests_and_offers.happ \
              workdir/requests_and_offers.webhapp \
              release-manifest.json
          fi

  desktop:
    name: Hand off to the desktop wrapper
    needs: [build, publish]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    # Pushes with KANGAROO_PAT, not the workflow token, which needs nothing here.
    permissions: {}
    steps:
      # Only the handoff script: the job runs no build and needs nothing else.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/release-wrapper.ts
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # One commit, no binary. The wrapper's own `publish` workflow triggers on a
      # push to `release`, and its `yarn setup` step already runs `fetch:webhapp`,
      # which downloads the URL below and verifies it against the sha256 before
      # packaging. That digest is the one this run measured, so a mismatched
      # webhapp stops the build there rather than shipping.
      #
      # `fetch-webhapp.js` refuses to run when a .webhapp is already sitting in
      # pouch/, so the same commit removes the committed binary. That is the
      # switch from a 13.8 MB file in git to a URL, and it happens once.
      #
      # The wrapper's publish workflow only uploads to `v$VERSION`; it never
      # creates the release. So it is created right after the push, on the
      # pushed commit, which makes its tag hold the config that built the
      # installers, as a prerelease when the version is one. The installer
      # builds take minutes before their first upload, so the release exists
      # by then; created before the push instead, it would sit published and
      # empty, and tag a commit without the webhapp.
      - name: Point the wrapper at this release and create its release
        env:
          # A token with contents: write on the wrapper repository. Soushi adds
          # it; nothing in this repository reads or creates it.
          GH_TOKEN: ${{ secrets.KANGAROO_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.webhapp_sha256 }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          WRAPPER=happenings-community/requests-and-offers-kangaroo-electron
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/requests_and_offers.webhapp"

          # The token goes in a header, never in the remote URL, where it would
          # be written to wrapper/.git/config.
          BASIC=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$BASIC"
          AUTH="AUTHORIZATION: basic $BASIC"
          git -c "http.https://github.com/.extraheader=$AUTH" \
            clone --depth 1 --branch release "https://github.com/${WRAPPER}.git" wrapper

          rm -f wrapper/pouch/*.webhapp
          bun scripts/release-wrapper.ts \
            --config wrapper/kangaroo.config.ts \
            --version "$VERSION" --url "$URL" --sha256 "$SHA256"

          cd wrapper
          git config user.name "requests-and-offers release"
          git config user.email "noreply@happenings.community"
          git add -A
          # A re-run finds the wrapper already pointed at this release. The push
          # is what starts the installer build, so it still happens, empty.
          if git diff --cached --quiet; then
            git commit --allow-empty -m "release: rebuild v${VERSION} installers"
          else
            git commit -m "release: v${VERSION} webhapp from the main repository"
          fi
          git -c "http.https://github.com/.extraheader=$AUTH" push origin release

          if gh release view "v$VERSION" --repo "$WRAPPER" >/dev/null 2>&1; then
            echo "v$VERSION already exists on $WRAPPER"
          else
            # PRERELEASE is unquoted on purpose: empty must vanish, not become "".
            gh release create "v$VERSION" \
              --repo "$WRAPPER" \
              --target "$(git rev-parse HEAD)" \
              --title "v$VERSION" \
              --notes "Desktop installers for Requests and Offers v$VERSION. Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
              $PRERELEASE
          fi
        shell: bash
