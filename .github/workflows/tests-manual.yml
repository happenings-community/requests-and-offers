name: Heavy tests (manual)

# Sweettest and end-to-end are deliberately kept off the pull-request path.
# Both spin real conductors. Sweettest is about 15 minutes over 14 test
# binaries on a developer machine and hours on a hosted runner (see the job's
# timeout comment); end-to-end measured 8m33s here on chromium alone. Paying
# either on every commit buys very little on a two-maintainer project. Run them
# here before a release, or when a change touches the zomes or the journey specs.

on:
  # Two ways in, because they answer different questions.
  #
  # workflow_dispatch: run a suite against a branch or tag, from the Actions tab.
  # Right before a release. Note it only appears there once this file is on the
  # default branch, so it is invisible while this pull request is open.
  #
  # A label on a pull request: run a suite against THAT pull request's code, with
  # the result showing as a check on it. This is the closest GitHub gets to
  # GitLab's manual pipeline job. The label is removed once the run starts, so
  # re-applying it re-runs the suite.
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        required: true
        default: sweettest
        options:
          - sweettest
          - e2e
          - both
      ref:
        description: Branch or tag to test (defaults to the selected ref)
        type: string
        required: false
  pull_request:
    types: [labeled]

concurrency:
  group: heavy-tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || inputs.suite }}
  cancel-in-progress: false

permissions:
  contents: read
  # Needed only to take the trigger label back off, so it can be applied again.
  pull-requests: write

jobs:
  sweettest:
    name: Sweettest (Rust integration)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'sweettest' || inputs.suite == 'both'))
      || (github.event_name == 'pull_request' && (github.event.label.name == 'run:sweettest' || github.event.label.name == 'run:heavy'))
    runs-on: ubuntu-latest
    # 240, not 90. Measured on run 34927665720: 13m15s to compile 841 crates,
    # then roughly 4 minutes per test binary and 35+ for the largest, over 14
    # binaries. A hosted runner has 4 cores against 16 on a developer machine,
    # and every test drives two real conductors, so the suite that takes about
    # 15 minutes locally does not take 15 minutes here. 90 would have timed out.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2
        with:
          key: sweettest-native-${{ hashFiles('flake.lock') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'


      - name: Remove the trigger label so it can be applied again
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/${{ github.event.label.name }}" \
            || echo "label already removed"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --test-threads 4 is not arbitrary. These tests wait on real DHT gossip
      # with a 15s ceiling, so on a contended machine they fail on the wait
      # rather than on the code. That is exactly how the v0.6.0-alpha.1 run first
      # went red. --no-fail-fast so one flaky binary does not hide the other 14.
      - name: Run sweettest
        run: |
          nix develop --command bash -c '
            bun run download-hrea
            test -s workdir/hrea.dna || { echo "hrea.dna missing or empty"; exit 1; }
            bun run build:happ
            CARGO_TARGET_DIR=target/native-tests cargo test -p requests_and_offers_sweettest --no-fail-fast -- --test-threads 4
          '

  e2e:
    name: End-to-end (Playwright)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e' || inputs.suite == 'both'))
      || (github.event_name == 'pull_request' && (github.event.label.name == 'run:e2e' || github.event.label.name == 'run:heavy'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-wasm32-${{ hashFiles('flake.lock') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'


      - name: Remove the trigger label so it can be applied again
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/${{ github.event.label.name }}" \
            || echo "label already removed"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd ui && bunx playwright install --with-deps chromium

      # The suite drives a live sandbox conductor, so it needs the packed hApp.
      # --project=chromium-desktop is required, not a preference. The config adds
      # firefox and webkit projects whenever CI is set, and Actions always sets it,
      # so without this the run launches browsers this job never installed. Three
      # browsers would also triple an already hour-long ordered journey, against a
      # single conductor and one shared agent identity that the first pass has
      # already driven through its states.
      - name: Run the end-to-end suite
        run: |
          nix develop --command bash -c '
            bun run download-hrea
            test -s workdir/hrea.dna || { echo "hrea.dna missing or empty"; exit 1; }
            bun run build:happ
            cd ui && bun run test:e2e -- --project=chromium-desktop
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          # playwright.config.ts writes the report to test-results/html-report and
          # traces to test-results/artifacts. There is no ui/playwright-report.
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
